<header class="site-header">
  <div class="container">
    <a href="/" class="logo">{{ .Site.Params.author | default .Site.Title }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav-list" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul id="nav-list" class="nav-list" role="list">
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}"
             class="nav-link"
             {{- if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
