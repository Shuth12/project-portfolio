baseURL = "https://example.org/"  # Update with your GitHub Pages URL or custom domain
locale = "en-us"
title = "Portfolio"  # Update with the designer's name

[params]
  author = "Shelley Cerny"           # Designer's name
  description = "We da best"      # One-line bio for meta tags
  email = "shelley.cerny@gmail.com"            # Contact email (for mailto: link)

  # Social links (platform = URL) — add/remove as needed
  [params.social]
    instagram = ""
    behance   = ""
    linkedin  = ""

[menu]
  [[menu.main]]
    name   = "Work"
    url    = "/work/"
    weight = 1
  [[menu.main]]
    name   = "About"
    url    = "/about/"
    weight = 2
  [[menu.main]]
    name   = "Contact"
    url    = "/contact/"
    weight = 3

[taxonomies]
  tag = "tags"

[build]
  writeStats = true

[outputs]
  home    = ["HTML", "RSS"]
  page    = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term     = ["HTML"]
